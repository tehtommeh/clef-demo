# Clef-Flash: FastAPI + transformers (vLLM cannot serve the custom joint
# schema head - this model scores options, it does not generate tokens).
services:
  api:
    build:
      context: ./api
      args:
        BASE_IMAGE: ${API_BASE_IMAGE}
    image: ${PROJECT_NAME}-api
    container_name: ${PROJECT_NAME}-api
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./models:/models:ro
      # Triton kernel cache, so fla kernels compile once rather than per start.
      - ./cache/triton:/cache/triton
    environment:
      MODEL_DIR: ${MODEL_DIR}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME}
      DTYPE: ${DTYPE}
      MAX_INPUT_TOKENS: ${MAX_INPUT_TOKENS}
      MAX_BATCH_TOKENS: ${MAX_BATCH_TOKENS}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE}
      MAX_IMAGE_SIDE: ${MAX_IMAGE_SIDE}
      VIDEO_MAX_FRAMES: ${VIDEO_MAX_FRAMES}
      VIDEO_MAX_SIDE: ${VIDEO_MAX_SIDE}
      TRITON_CACHE_DIR: /cache/triton
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /tmp/hf
    shm_size: ${SHM_SIZE:-8gb}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: ${HEALTH_START_PERIOD:-600s}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
    image: ${PROJECT_NAME}-frontend
    container_name: ${PROJECT_NAME}-frontend
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${FRONTEND_PORT:-7860}:7860"
    environment:
      API_BASE: http://api:8000
      PUBLIC_API_BASE: http://localhost:${API_PORT:-8000}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME}
    depends_on:
      api:
        condition: service_healthy
